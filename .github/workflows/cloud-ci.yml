name: cloud-ci

on:
  pull_request:
    paths:
      - 'cloud/**'
      - '.github/workflows/cloud-ci.yml'
      - 'client/**'
      - 'lib/**'
      - 'version.h'
      - 'project_specific_defines.h'
  push:
    branches: [main]
    paths:
      - 'cloud/**'
      - '.github/workflows/cloud-ci.yml'
      - 'client/**'
      - 'lib/**'
      - 'version.h'
      - 'project_specific_defines.h'

permissions:
  contents: read

concurrency:
  group: cloud-ci-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: cloud

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal --component rustfmt,clippy
          rustup default stable
          rustup target add wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cloud
      - name: Format
        run: cargo fmt --all --check
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings
      - name: Clippy, Workers
        run: >
          cargo clippy --target wasm32-unknown-unknown
          -p cb-scheduler-worker -p cb-files-worker -p cb-pipeline-worker
          -p cb-web-worker -p cb-admin-worker -- -D warnings
      - name: Tests
        run: cargo test
      - name: Local router
        run: node --test dev/router/routes.test.mjs
      - name: Build Workers
        run: |
          cargo install worker-build --version 0.8.7 --locked
          dev/build.sh

  # The client's own parsers read the replies the server writes. The oracle
  # is built from the upstream sources in this tree, so the job also runs
  # when a merge from upstream changes client/ or lib/.
  parser-oracle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            g++ make libcurl4-openssl-dev libssl-dev zlib1g-dev
      - name: Build the oracle
        run: make -C tests/parser-oracle -j"$(nproc)"
      - name: Rust toolchain
        run: |
          rustup toolchain install stable --profile minimal
          rustup default stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: cloud
      - name: Compare replies
        env:
          CB_PARSER_ORACLE_REQUIRED: '1'
        run: cargo test -p cb-core --test parser_oracle
