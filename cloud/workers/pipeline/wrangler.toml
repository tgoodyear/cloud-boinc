# The top-level values describe the reference dev deployment. Another
# deployment changes the route host, zone and database_id; see
# docs/deploy.md.
name = "cloud-boinc-pipeline"
# Built by dev/build.sh; wrangler only bundles and uploads it.
main = "build/index.js"
compatibility_date = "2026-10-01"
workers_dev = false

[observability]
enabled = true

[placement]
mode = "smart"

[[d1_databases]]
binding = "DB"
database_name = "cloud-boinc-dev"
database_id = "3ae057c8-0c75-418c-b975-b2a91b60ac33"
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "cloud-boinc-dev"

# The results bucket the export writes to (docs/deploy.md, "Results bucket").
[[r2_buckets]]
binding = "RESULTS"
bucket_name = "cloud-boinc-dev-results"

[[queues.producers]]
binding = "TRANSITIONS"
queue = "cloud-boinc-dev-transitions"

[[queues.consumers]]
queue = "cloud-boinc-dev-transitions"
max_batch_size = 25
max_batch_timeout = 1
max_retries = 5

[triggers]
# Every minute: the sweep. Every five minutes: the purge (PURGE_CRON in src/lib.rs).
# Every two minutes: the export to the results bucket (EXPORT_CRON), which does
# nothing in a deployment that binds no RESULTS bucket (see docs/deploy.md,
# "Results bucket").
crons = ["* * * * *", "*/5 * * * *", "*/2 * * * *"]
