# The top-level values describe the reference dev deployment. Another
# deployment changes the route host, zone and database_id; see
# docs/deploy.md.
name = "cloud-boinc-web"
# Built by dev/build.sh; wrangler only bundles and uploads it.
main = "build/index.js"
compatibility_date = "2026-10-01"
workers_dev = false

[observability]
enabled = true

[placement]
mode = "smart"

[[routes]]
pattern = "boinc-dev.usnewsmap.com/*"
zone_name = "usnewsmap.com"

# Stock server URL layout: the pages under `/example/` are covered by the route above.
# A deployment whose route is narrower than `/*` adds this one, with its short name:
# [[routes]]
# pattern = "boinc-dev.usnewsmap.com/example/*"
# zone_name = "usnewsmap.com"

[[d1_databases]]
binding = "DB"
database_name = "cloud-boinc-dev"
database_id = "3ae057c8-0c75-418c-b975-b2a91b60ac33"
migrations_dir = "../../migrations"

# Email: the site sends password recovery, verification and address-change mail
# through this binding when it is present (see "Email" in docs/deploy.md). Left
# commented out here: it needs the Workers Paid plan and a sending domain. Set
# the address to the config's email_from.
# [[send_email]]
# name = "EMAIL"
# allowed_sender_addresses = ["boinc@mail.example.org"]
