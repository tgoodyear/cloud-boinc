# The top-level values describe the reference dev deployment. Another
# deployment changes the route host, zone and database_id; see
# docs/deploy.md.
name = "cloud-boinc-files"
# Built by dev/build.sh; wrangler only bundles and uploads it.
main = "build/index.js"
compatibility_date = "2026-10-01"
workers_dev = false

[observability]
enabled = true

[[routes]]
pattern = "boinc-dev.usnewsmap.com/download/*"
zone_name = "usnewsmap.com"

[[routes]]
pattern = "boinc-dev.usnewsmap.com/upload*"
zone_name = "usnewsmap.com"

# Stock server URL layout (docs/deploy.md, "Stock layout routes"): uncomment, and
# replace `example` with the project's short name, to answer the stock upload handler
# and download paths. The download path is under the pages' path, so it must be a
# route of its own: the more specific pattern wins over the web Worker's `/*`.
# [[routes]]
# pattern = "boinc-dev.usnewsmap.com/example_cgi/file_upload_handler*"
# zone_name = "usnewsmap.com"
#
# [[routes]]
# pattern = "boinc-dev.usnewsmap.com/example/download/*"
# zone_name = "usnewsmap.com"

[[d1_databases]]
binding = "DB"
database_name = "cloud-boinc-dev"
database_id = "3ae057c8-0c75-418c-b975-b2a91b60ac33"
migrations_dir = "../../migrations"

[[r2_buckets]]
binding = "FILES"
bucket_name = "cloud-boinc-dev"
