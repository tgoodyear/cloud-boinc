[package]
name = "cb-files-worker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "cloud-boinc files Worker. File transfer: GET /download, POST /upload/file_upload_handler"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
async-trait = "0.1"
cb-core = { path = "../../crates/cb-core" }
cb-db = { path = "../../crates/cb-db" }
cb-proto = { path = "../../crates/cb-proto" }
cb-worker = { path = "../../crates/cb-worker" }
futures-channel = "0.3"
js-sys = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
wasm-bindgen = "0.2"
wasm-bindgen-futures = "0.4"
web-sys = { version = "0.3", features = ["ReadableStream"] }
worker = { version = "0.8", features = ["d1", "queue"] }
