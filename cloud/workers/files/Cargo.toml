[package]
name = "cb-files-worker"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "cloud-boinc files Worker. File transfer: GET /download, POST /upload"
publish = false

[lib]
crate-type = ["cdylib"]

[dependencies]
cb-core = { path = "../../crates/cb-core" }
cb-crypto = { path = "../../crates/cb-crypto" }
cb-db = { path = "../../crates/cb-db" }
cb-proto = { path = "../../crates/cb-proto" }
cb-worker = { path = "../../crates/cb-worker" }
futures-util = { version = "0.3", default-features = false }
hex = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
worker = { version = "0.8", features = ["d1", "queue"] }
