[package]
name = "cboinc"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "cloud-boinc command line: admin API client, key tools, app signing"
publish = false

[dependencies]
cb-crypto = { path = "../crates/cb-crypto", features = ["keygen"] }
clap = { version = "4", features = ["derive", "env"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
