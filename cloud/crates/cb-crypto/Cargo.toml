[package]
name = "cb-crypto"
version = "0.1.0"
edition.workspace = true
license.workspace = true
description = "BOINC key files, MD5-based RSA signatures and account hashes in pure Rust"

[features]
default = []
# RSA key pair generation. Needs a random number generator, so it is kept out
# of the default (wasm32-unknown-unknown) build.
keygen = ["rsa/getrandom"]

[dependencies]
hex = "0.4"
hmac = "0.12"
md-5 = "0.10"
# No "std" feature here: it turns on rand_core/std, which pulls in getrandom
# and breaks the wasm32-unknown-unknown build.
rsa = { version = "0.9", default-features = false, features = ["u64_digit"] }
sha2 = "0.10"
subtle = "2"
zeroize = "1"

[dev-dependencies]
rsa = { version = "0.9", default-features = false, features = ["std", "u64_digit", "pem"] }
